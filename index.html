body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap}

nav{display:flex;gap:6px;flex-wrap:wrap}

nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
nav button.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
nav button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
header{padding-top:calc(10px + env(safe-area-inset-top))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.big{font-size:96px;font-weight:700;text-align:center;line-height:1.1}
.atop{position:sticky;top:var(--hh,60px);z-index:4;background:var(--bg);padding:8px 0 6px;margin:-16px 0 8px}
.atop .card{display:flex;gap:14px;align-items:center;padding:12px 14px;margin:6px 0 8px}
.atop .lt{font-size:52px;font-weight:700;line-height:1;min-width:92px;text-align:center}
.atop .info{flex:1;min-width:0;font-size:14px}
.atop .info .bs{font-size:19px}
.atop .emoji{font-size:34px}
.tile.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.grid.agrid{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}
.grid.agrid .tile{padding:8px 4px;font-size:12px}
.center{text-align:center}.mute{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:var(--card)}
.tile b{font-size:28px;display:block}
.sp{color:var(--acc2);font-weight:700}
.end{color:var(--acc);font-weight:700}
.emoji{font-size:48px}
table{width:100%;border-collapse:collapse}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.pr{font-size:26px;width:44px}
.bs{font-size:20px;font-weight:600}
.ph{font-size:13px;color:var(--mute)}
.opt{display:block;width:100%;margin:6px 0;text-align:left}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.now{font-size:28px;text-align:center;min-height:90px}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);font-size:13px}

/* ====================== TÜRKÇE ÇEKİM ====================== */
function trPres(s){return [s+"um",s+"sun",s,s+"uz",s+"sunuz",s+"lar"]}
function trPast([b,v]){const f="iü".includes(v);return [b+"m",b+"n",b,b+"k",b+"n"+v+"z",b+(f?"ler":"lar")]}
function trFut(b){const f=b.endsWith("ecek"),r=b.slice(0,-1);return [r+"ğ"+(f?"im":"ım"),b+(f?"sin":"sın"),b,r+"ğ"+(f?"iz":"ız"),b+(f?"siniz":"sınız"),b+(f?"ler":"lar")]}
const TENSES=[["pres","Şimdiki zaman"],["neg","Olumsuz"],["past","Geçmiş"],["fut","Gelecek"]];

function conj(L,v,tense){
  const P=L.pron, o=v.obj?" "+v.obj:"";
  let bs,tr;
  if(v.tr6) tr=v.tr6[tense];
  else tr={pres:()=>trPres(v.t.pres),neg:()=>trPres(v.t.neg),past:()=>trPast(v.t.past),fut:()=>trFut(v.t.fut)}[tense]();
  if(tense==="pres") bs=v.pres.map((f,i)=>`${P[i]} ${f}${o}`);
  if(tense==="neg")  bs=(v.negPres||v.pres.map(f=>"ne "+f)).map((f,i)=>`${P[i]} ${f}${o}`);
  if(tense==="past") bs=P.map((p,i)=>`${p} ${L.aux.past[i]} ${i<3?v.pp[0]:v.pp[2]}${o}`);
  if(tense==="fut")  bs=P.map((p,i)=>`${p} ${L.aux.fut[i]} ${v.futInf||v.bs}${o}`);
  return P.map((_,i)=>({bs:bs[i],tr:PRON_TR[i]+" "+tr[i],fem:tense==="past"&&i<3?v.pp[1]:null}));
}

/* ====================== YARDIMCI ====================== */
const $=s=>document.querySelector(s);
const st=(()=>{try{return JSON.parse(localStorage.getItem("dilogren")||"{}")}catch{return{}}})();
function save(){try{localStorage.setItem("dilogren",JSON.stringify(st))}catch{}}
const L=()=>LANGS[st.lang];
function phon(w){let s=w.toLowerCase();for(const[a,b]of L().phon)s=s.split(a).join(b);return s}
function hl(w){ // özel harfleri renklendir
  let out="",i=0;const sp=L().special;
  while(i<w.length){const m=sp.find(x=>w.slice(i,i+x.length).toLowerCase()===x);
    if(m){out+=`<span class="sp">${w.slice(i,i+m.length)}</span>`;i+=m.length}else out+=w[i++]}
  return out}
function ending(a){ // ortak kökü bul, ekleri renklendir
  const ws=a.map(s=>s.split(" ").pop());let p=ws[0].length;
  for(const w of ws)while(p&&w.slice(0,p)!==ws[0].slice(0,p))p--;
  return a.map(s=>{const parts=s.split(" "),last=parts.pop();
    return parts.join(" ")+(parts.length?" ":"")+last.slice(0,p)+`<span class="end">${last.slice(p)}</span>`})}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function esc(s){return s.replace(/'/g,"\\'")}

/* ====================== SES ====================== */
let voices=[];function loadV(){voices=speechSynthesis.getVoices()}
loadV();speechSynthesis.onvoiceschanged=loadV;
function pickVoice(prefs){for(const p of prefs){const v=voices.find(v=>v.lang.toLowerCase().startsWith(p));if(v)return v}return null}
// Önce hazır MP3 (doğal ses), yoksa tarayıcı sesi
const AU=new Audio();AU.preload="auto";let AIDX={};
function loadAudioIdx(){if(!st.lang)return;fetch(`audio/${st.lang}/index.json`).then(r=>r.json()).then(j=>AIDX=j).catch(()=>AIDX={})}
function vgSel(){return `<div class="row"><span class="mute">Ses:</span>${[["f","👩 Kadın"],["m","👨 Erkek"]].map(([k,t])=>`<button class="btn ${(st.vg||"f")===k?"pri":""}" onclick="setVg('${k}',this)">${t}</button>`).join("")}</div>`}
function setVg(k,b){st.vg=k;save();b.parentNode.querySelectorAll(".btn").forEach(x=>x.classList.toggle("pri",x===b));play(L().alphabet[0][3])}
function stopAll(){speechSynthesis.cancel();AU.onended=AU.onerror=null;AU.pause()}
function ttsSay(text,lang,rate){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    const v=lang==="tr"?pickVoice(["tr"]):pickVoice(L().voice);
    if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==="tr"?"tr-TR":"hr-HR";
    u.rate=rate||(lang==="tr"?1:(st.rate||0.85));
    u.onend=u.onerror=()=>res();speechSynthesis.speak(u);
  })}
function say(text,lang="target",rate){
  const f=(AIDX[lang==="tr"?"tr":st.lang]||{})[text];
  if(!f)return ttsSay(text,lang,rate);
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    AU.onended=fin;AU.onerror=()=>{if(!done){done=true;ttsSay(text,lang,rate).then(res)}};
    AU.src=`audio/${st.lang}${st.vg==="m"?"-m":""}/${f}`;
    AU.playbackRate=lang==="tr"?1:(st.rate||0.85)/0.85;
    AU.play().catch(()=>AU.onerror&&AU.onerror());
  })}
function play(t){stopAll();say(t)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ====================== EKRANLAR ====================== */
const SCREENS={pick:"🌍 Dil",alpha:"🔤 Alfabe",read:"📖 Okuma",vocab:"📚 Kelime",verbs:"🔁 Fiiller",listen:"🎧 Dinle"};
function nav(){
  const n=$("#nav");n.innerHTML="";
  for(const[k,t]of Object.entries(SCREENS)){
    const b=document.createElement("button");const[ic,...tx]=t.split(" ");b.innerHTML=`<span class="ic">${ic}</span> ${tx.join(" ")}`;
    b.className=st.screen===k?"on":"";
    b.disabled=!st.lang&&k!=="pick";
    b.onclick=()=>go(k);n.appendChild(b)}
  $("#langName").textContent=st.lang?"· "+L().flag+" "+L().name:"";
}
function done(k){return st.prog?.[st.lang]?.[k]}
function mark(k){st.prog=st.prog||{};st.prog[st.lang]=st.prog[st.lang]||{};st.prog[st.lang][k]=true;save()}
let qT=0;function nextQ(f,ms){clearTimeout(qT);qT=setTimeout(f,ms)}
function quitQuiz(k){clearTimeout(qT);aq=[];rq=[];stopAll();if(k==="alpha")ai=0;go(k)}
function go(k){clearTimeout(qT);if(st.lang&&ai>=L().alphabet.length)ai=0;aq=[];rq=[];st.screen=k;save();nav();setHH();$("#app").innerHTML="";R[k]();scrollTo(0,0)}
function setHH(){document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px")}
addEventListener("resize",setHH);

const R={};
R.pick=()=>{
  $("#app").innerHTML=`<div class="card"><h2>Hangi dili öğreneceksin?</h2><p class="mute">Ana dilin: Türkçe 🇹🇷</p>${st.lang?vgSel()+"<br>":""}
  <div class="grid">${Object.entries(LANGS).map(([k,l])=>`<div class="tile" onclick="pickLang('${k}')"><b>${l.flag}</b>${l.name}</div>`).join("")}
  ${COMING.map(([f,n])=>`<div class="tile" style="opacity:.4"><b>${f}</b>${n}<br><span class="chip">yakında</span></div>`).join("")}</div></div>
  <div class="card"><h3>Yol haritası</h3><ol><li><b>Alfabe</b> — her harf bir kere, ses + örnek kelime + mini test</li>
  <li><b>Okuma</b> — kurallar, sonra kolaydan zora kelime ve cümleler</li><li><b>Fiiller</b> — istiyorum / yapıyorum / geliyorum / gidiyorum… tüm zamirlerle, 4 zamanda</li>
  <li><b>Dinle</b> — ekran kapalıyken/arka planda kulaktan tekrar</li></ol></div>`};
function pickLang(k){st.lang=k;save();loadAudioIdx();go(done("alpha")?"verbs":"alpha")}

/* --- ALFABE --- */
let ai=0;
R.alpha=()=>{
  const A=L().alphabet;
  if(ai>=A.length)return alphaQuiz();
  if(!$("#atop")){
    $("#app").innerHTML=`<div class="atop" id="atop"></div>
    <div class="card"><p class="mute" style="margin:0 0 8px">Harfe dokun — üstteki kart değişir, liste yerinde kalır.</p><div class="grid agrid">${A.map((a,i)=>`<div class="tile" id="at${i}" onclick="ai=${i};R.alpha()"><b class="${L().special.includes(a[0].toLowerCase())?"sp":""}">${a[0]}</b>${a[2].split(" ")[0]}</div>`).join("")}</div></div>`}
  const[up,name,snd,word,tr,emo]=A[ai];
  $("#atop").innerHTML=`<div class="bar"><i style="width:${(ai+1)/A.length*100}%"></i></div>
  <div class="card"><div class="lt">${up}${up.length>1?up[0]+up[1].toLowerCase():up.toLowerCase()}</div>
   <div class="info"><div>Adı <b>${name}</b> · ses: <b>${snd}</b></div>
   <div><span class="bs">${hl(word)}</span> <span class="ph">“${phon(word)}” · ${tr}</span></div></div>
   <div class="emoji">${emo}</div></div>
  <div class="row" style="justify-content:space-between"><button class="btn" onclick="ai=Math.max(0,ai-1);R.alpha()" ${ai?"":"disabled"}>←</button>
   <button class="btn" onclick="sayLetter()">🔊 ${ai+1}/${A.length}</button>
   <button class="btn" onclick="aq=[];ai=A_LEN();R.alpha()">🎯 Test</button>
   <button class="btn pri" onclick="ai++;R.alpha()">→</button></div>`;
  document.querySelectorAll(".agrid .tile.cur").forEach(t=>t.classList.remove("cur"));
  $("#at"+ai)?.classList.add("cur");
  sayLetter()};
function A_LEN(){return L().alphabet.length}
async function sayLetter(){const[,name,,word]=L().alphabet[ai];stopAll();await say(name);await wait(300);await say(word)}
let aq=[];
function alphaQuiz(){
  if(!aq.length)aq=shuffle(L().alphabet.filter(a=>a[2].length>1)).slice(0,8).map(a=>({a,ok:null}));
  const q=aq.find(x=>x.ok===null);
  if(!q){const s=aq.filter(x=>x.ok).length;
    if(s>=6)mark("alpha");
    $("#app").innerHTML=`<div class="card center"><h2>${s>=6?"🎉 Alfabe tamam!":"Biraz daha tekrar"}</h2><p>${s} / ${aq.length} doğru</p>
    ${s>=6?`<button class="btn pri" onclick="go('read')">Okumaya geç →</button>`:`<button class="btn pri" onclick="aq=[];ai=0;R.alpha()">Alfabeyi tekrar et</button>`}
    <button class="btn" onclick="aq=[];alphaQuiz()">Testi tekrarla</button></div>`;nav();return}
  const opts=shuffle([q.a,...shuffle(L().alphabet.filter(x=>x!==q.a&&x[2].length>1)).slice(0,3)]);
  $("#app").innerHTML=`<div class="card center"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mute">🎯 Test</span><button class="btn" onclick="quitQuiz('alpha')">✕ Çık</button></div><p class="mute">Mini test — bu harf nasıl okunur?</p><div class="big">${q.a[0]}</div>
  ${opts.map(o=>`<button class="btn opt" onclick="ansA(this,${o===q.a})">${o[2]}</button>`).join("")}</div>`;
  play(q.a[1])}
function ansA(b,ok){const q=aq.find(x=>x.ok===null);q.ok=ok;b.classList.add(ok?"ok":"bad");say(q.a[3]);nextQ(alphaQuiz,1300)}

/* --- OKUMA --- */
let ri=0;
R.read=()=>{
  const RD=L().reading;
  $("#app").innerHTML=`<div class="card"><h3>Okuma kuralları</h3><ul>${L().readingRules.map(r=>`<li>${r}</li>`).join("")}</ul>
  <p class="mute">Turuncu harfler = Türkçeden farklı okunanlar. Önce kendin oku, sonra 🔊 ile kontrol et.</p></div>
  <div class="row">${RD.map((l,i)=>`<button class="btn ${i===ri?"pri":""}" onclick="ri=${i};R.read()">${l.title}</button>`).join("")}</div><br>
  <div class="card"><table>${RD[ri].words.map(([w,tr,e])=>`<tr><td class="pr">${e}</td><td><div class="bs">${hl(w)}</div><div class="ph reveal" style="filter:blur(5px)" onclick="this.style.filter='none'">okunuş: “${phon(w)}” — ${tr}</div></td>
  <td style="width:60px"><button class="btn" onclick="play('${esc(w)}');this.closest('tr').querySelector('.reveal').style.filter='none'">🔊</button></td></tr>`).join("")}</table>
  <p class="mute">İpucu: okunuşu görmek için bulanık yazıya dokun.</p></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="readQuiz()">🎯 Bu dersin testi</button>
  ${ri<RD.length-1?`<button class="btn pri" onclick="ri++;R.read()">Sonraki ders →</button>`:`<button class="btn pri" onclick="mark('read');go('verbs')">Fiillere geç →</button>`}</div>`};
let rq=[];
function readQuiz(){
  const W=L().reading[ri].words;
  if(!rq.length)rq=shuffle(W).map(w=>({w,ok:null}));
  const q=rq.find(x=>x.ok===null);
  if(!q){const s=rq.filter(x=>x.ok).length;rq=[];
    $("#app").innerHTML=`<div class="card center"><h2>${s} / ${W.length}</h2><button class="btn pri" onclick="R.read()">Derse dön</button></div>`;
    if(ri===L().reading.length-1&&s>=W.length-1)mark("read");nav();return}
  const opts=shuffle([q.w,...shuffle(W.filter(x=>x!==q.w)).slice(0,3)]);
  $("#app").innerHTML=`<div class="card center"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mute">🎯 Test</span><button class="btn" onclick="quitQuiz('read')">✕ Çık</button></div><p class="mute">Dinle — hangisini duydun?</p><button class="btn" style="font-size:32px" onclick="play('${esc(q.w[0])}')">🔊</button>
  ${opts.map(o=>`<button class="btn opt bs" onclick="ansR(this,${o===q.w})">${hl(o[0])}</button>`).join("")}</div>`;
  play(q.w[0])}
function ansR(b,ok){rq.find(x=>x.ok===null).ok=ok;b.classList.add(ok?"ok":"bad");nextQ(readQuiz,900)}

/* --- KELİMELER --- */
let vci=0;
R.vocab=()=>{const C=L().vocab,c=C[vci];
  $("#app").innerHTML=`<div class="row">${C.map((x,i)=>`<button class="btn ${i===vci?"pri":""}" onclick="vci=${i};R.vocab()">${x.t}</button>`).join("")}</div><br>
  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${c.t}</h3><button class="btn pri" onclick="playVocab()">▶︎ Hepsini oku</button></div>
  ${c.n?`<p class="mute">${c.n}</p>`:""}
  <table>${c.w.map(([tr,bs],i)=>`<tr id="vw${i}"><td><div class="bs">${hl(bs)}</div><div class="ph">${tr} · “${phon(bs)}”</div></td>
  <td style="width:60px"><button class="btn" onclick="play('${esc(bs)}')">🔊</button></td></tr>`).join("")}</table></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="vocabQuiz()">🎯 Test</button></div>`};
async function playVocab(){stopAll();const w=L().vocab[vci].w;
  for(let i=0;i<w.length;i++){const r=$("#vw"+i);if(!r||st.screen!=="vocab")return;r.style.background="var(--line)";await say(w[i][0],"tr");await wait(250);await say(w[i][1]);await wait(500);r.style.background=""}}
function vocabQuiz(){const W=L().vocab[vci].w,a=W[Math.floor(Math.random()*W.length)];
  const opts=shuffle([a,...shuffle(W.filter(x=>x!==a)).slice(0,3)]);
  $("#app").innerHTML=`<div class="card center"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mute">🎯 Test</span><button class="btn" onclick="quitQuiz('vocab')">✕ Çık</button></div>
  <p class="mute">Boşnakçası hangisi?</p><h2>${a[0]}</h2>
  ${opts.map(o=>`<button class="btn opt bs" onclick="this.classList.add(${o===a}?'ok':'bad');play('${esc(a[1])}');nextQ(vocabQuiz,1400)">${hl(o[1])}</button>`).join("")}</div>`}

/* --- FİİLLER --- */
let vi=0,tn="pres";
R.verbs=()=>{
  const V=L().verbs,v=V[vi],rows=conj(L(),v,tn);
  const bsH=ending(rows.map(r=>r.bs)),trH=ending(rows.map(r=>r.tr));
  $("#app").innerHTML=`<div class="row">${V.map((x,i)=>`<button class="btn ${i===vi?"pri":""}" onclick="vi=${i};R.verbs()">${x.e} ${x.tr.split(" ")[0]}</button>`).join("")}</div><br>
  <div class="card"><div class="row" style="justify-content:space-between"><div><span class="emoji">${v.e}</span> <span class="bs" style="font-size:26px">${hl(v.bs)}</span> <span class="mute">= ${v.tr}</span></div>
  <button class="btn pri" onclick="playTable()">▶︎ Hepsini oku</button></div>
  <div class="row" style="margin:10px 0">${TENSES.map(([k,t])=>`<button class="btn ${k===tn?"pri":""}" onclick="tn='${k}';R.verbs()">${t}</button>`).join("")}</div>
  <table>${rows.map((r,i)=>`<tr id="vr${i}"><td class="pr">${PRON_EMO[i]}</td><td><div class="bs">${bsH[i]}</div><div class="ph">${trH[i]}${r.fem?` · <i>kadın: …${r.fem}</i>`:""} · “${phon(r.bs)}”</div></td>
  <td style="width:60px"><button class="btn" onclick="play('${esc(r.bs)}')">🔊</button></td></tr>`).join("")}</table>
  <p class="mute">Mavi = ek. Boşnakçada zamir çoğu zaman düşer: “${rows[0].bs.split(" ").slice(1).join(" ")}” de yeterli.</p></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="verbQuiz()">🎯 Test et</button></div>`};
async function playTable(){stopAll();const rows=conj(L(),L().verbs[vi],tn);
  for(let i=0;i<6;i++){const tr=$("#vr"+i);if(!tr)return;tr.style.background="var(--line)";await say(rows[i].tr,"tr");await wait(250);await say(rows[i].bs);await wait(400);tr.style.background=""}}
function verbQuiz(){
  const V=L().verbs,v=V[Math.floor(Math.random()*V.length)],t=TENSES[Math.floor(Math.random()*4)][0];
  const rows=conj(L(),v,t),i=Math.floor(Math.random()*6),ans=rows[i];
  const opts=shuffle([ans,...shuffle(rows.filter((_,j)=>j!==i&&rows[j].bs!==ans.bs)).slice(0,3)]);
  $("#app").innerHTML=`<div class="card center"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mute">🎯 Test</span><button class="btn" onclick="quitQuiz('verbs')">✕ Çık</button></div><p class="mute">Boşnakçası hangisi?</p><div class="emoji">${PRON_EMO[i]} ${v.e}</div><h2>${ans.tr}</h2>
  ${opts.map(o=>`<button class="btn opt bs" onclick="this.classList.add(${o===ans}?'ok':'bad');play('${esc(ans.bs)}');nextQ(verbQuiz,1400)">${o.bs}</button>`).join("")}
  <br><button class="btn" onclick="quitQuiz('verbs')">✕ Testten çık</button></div>`}

/* --- DİNLE (arka plan) --- */
let lRun=false,lQ=[],lI=0,wake=null;
function buildQueue(kind){const q=[],l=L();
  if(kind==="alpha"||kind==="all")l.alphabet.forEach(a=>q.push({tr:a[4],bs:a[3],show:a[0]+" — "+a[3]}));
  if(kind==="read"||kind==="all")l.reading.forEach(r=>r.words.forEach(w=>q.push({tr:w[1],bs:w[0],show:w[0]})));
  if(kind==="vocab"||kind==="all")l.vocab.forEach(c=>c.w.forEach(([tr,bs])=>q.push({tr,bs,show:bs})));
  if(kind==="verbs"||kind==="all")l.verbs.forEach(v=>TENSES.forEach(([t])=>conj(l,v,t).forEach(r=>q.push({tr:r.tr,bs:r.bs,show:r.bs}))));
  return st.shuffle?shuffle(q):q}
R.listen=()=>{
  $("#app").innerHTML=`<div class="card"><h3>🎧 Kulaktan öğren</h3>${vgSel()}<br><p class="mute">Türkçe → Boşnakça → (sen tekrar et) → Boşnakça. Kulaklık tak, telefonu cebe koy.</p>
  <div class="row"><select id="lk"><option value="verbs">Fiiller (tüm zamirler, 4 zaman)</option><option value="vocab">Temel kelimeler (soru, zamir, zaman…)</option><option value="read">Okuma kelimeleri</option><option value="alpha">Alfabe kelimeleri</option><option value="all">Hepsi</option></select>
  <label><input type="checkbox" id="lsh" ${st.shuffle?"checked":""} onchange="st.shuffle=this.checked;save()"> Karışık</label>
  <label>Hız <input type="range" min="0.5" max="1.2" step="0.05" value="${st.rate||0.85}" oninput="st.rate=+this.value;save()"></label></div></div>
  <div class="card"><div class="now" id="now"><span class="mute">Hazır</span></div><div class="bar"><i id="lbar" style="width:0"></i></div><br>
  <div class="row" style="justify-content:center"><button class="btn" onclick="lStep(-1)">⏮</button><button class="btn pri" id="lbtn" onclick="lToggle()">▶︎ Başlat</button><button class="btn" onclick="lStep(1)">⏭</button></div></div>
  <div class="card mute" style="font-size:14px">Arka plan notu: Android Chrome'da ekran kapanınca da çalmaya devam eder (kilit ekranından kontrol edilebilir). iPhone Safari, sekme arka plana geçince konuşmayı durdurabilir — bu durumda “ekranı açık tut” otomatik devrede.</div>`;
  if(lRun)lShow()};
function silentWav(){const n=8000,b=new ArrayBuffer(44+n*2),d=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");d.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
async function lToggle(){
  if(lRun){lRun=false;stopAll();$("#silence").pause();$("#lbtn").textContent="▶︎ Devam";wake?.release?.();return}
  if(!lQ.length||$("#lk")?.dataset.k!==$("#lk").value){lQ=buildQueue($("#lk").value);lI=0;$("#lk").dataset.k=$("#lk").value}
  lRun=true;$("#lbtn").textContent="⏸ Durdur";
  const s=$("#silence");if(!s.src)s.src=silentWav();s.play().catch(()=>{});
  try{wake=await navigator.wakeLock?.request("screen")}catch{}
  if("mediaSession"in navigator){navigator.mediaSession.setActionHandler("play",()=>!lRun&&lToggle());navigator.mediaSession.setActionHandler("pause",()=>lRun&&lToggle());
    navigator.mediaSession.setActionHandler("nexttrack",()=>lStep(1));navigator.mediaSession.setActionHandler("previoustrack",()=>lStep(-1))}
  lLoop()}
function lShow(){const it=lQ[lI];if(!it)return;const n=$("#now");if(n)n.innerHTML=`<div class="bs" style="font-size:30px">${hl(it.show)}</div><div class="mute">${it.tr}</div>`;
  const b=$("#lbar");if(b)b.style.width=(lI/lQ.length*100)+"%";
  if("mediaSession"in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:it.bs,artist:it.tr,album:"Dil Öğren · "+L().name})}
let lTok=0;
async function lLoop(){const tok=++lTok;
  while(lRun&&tok===lTok){const it=lQ[lI%lQ.length];lShow();
    await say(it.tr,"tr");if(!lRun||tok!==lTok)break;await wait(500);
    await say(it.bs);await wait(1800); // sen tekrar et
    if(!lRun||tok!==lTok)break;await say(it.bs);await wait(1000);
    if(tok===lTok)lI=(lI+1)%lQ.length}}
function lStep(d){if(!lQ.length)return;lI=(lI+d+lQ.length)%lQ.length;stopAll();lShow();if(lRun)lLoop()}

/* ====================== BAŞLAT ====================== */
if(!st.lang)st.screen="pick";
loadAudioIdx();nav();setHH();R[st.screen||"pick"]();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
